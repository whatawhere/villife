<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="description" content="Sign in to your Villife profile.">
  <meta name="robots" content="index, follow">
  <title>Sign in — Villife</title>
  <link rel="canonical" href="https://web.villife.hs.vc/signin/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Villife">
  <meta property="og:title" content="Sign in — Villife">
  <meta property="og:url" content="https://web.villife.hs.vc/signin/">
  <link rel="icon" href="/villife.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/villife.css">
  <style>
    :root { --ink-soft: #b9c1b6; --faint: #8f988d; --line: rgb(224 236 217 / 14%); --glass-strong: rgb(24 29 23 / 90%); --shadow-mid: 0 18px 60px rgb(0 0 0 / 35%); --accent: var(--lime); --accent-soft: #dafa9c; }
    .signup-page { position: relative; z-index: 4; min-height: 100vh; display: flex; flex-direction: column; }
    .signup-header { display: flex; width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 28px 0; align-items: center; justify-content: space-between; }
    .signup-brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-family: var(--display); font-size: 21px; font-weight: 600; }
    .signup-brand img { width: 32px; height: 32px; }
    .signup-back { color: var(--ink-soft); font-size: 13px; transition: color .3s ease; }
    .signup-back:hover { color: var(--accent); }
    .signup-main { flex: 1; display: grid; place-items: center; padding: 20px 24px 80px; }
    .signup-card { width: min(460px, 100%); padding: 40px; border: 1px solid var(--line); border-radius: 24px; background: var(--glass-strong); box-shadow: var(--shadow-mid); backdrop-filter: blur(20px); }
    .signup-eyebrow { color: var(--faint); font-size: 10px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; }
    .signup-title { margin: 12px 0 6px; font-family: var(--display); font-size: 34px; font-weight: 500; line-height: 1.15; }
    .signup-subtitle { margin: 0 0 28px; color: var(--ink-soft); font-size: 14px; }
    .signup-field { display: block; margin-bottom: 16px; }
    .signup-field > span { display: block; margin-bottom: 7px; color: var(--ink-soft); font-size: 12px; font-weight: 600; }
    .signup-field input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; outline: none; background: rgba(255, 255, 255, .7); color: var(--ink); font: inherit; font-size: 14px; transition: border-color .25s ease, box-shadow .25s ease; }
    .signup-field input:focus { border-color: var(--accent-soft); box-shadow: 0 0 0 3px rgba(93, 124, 242, .12); }
    .signup-submit { width: 100%; margin-top: 10px; cursor: pointer; }
    .signup-note { margin: 18px 0 0; color: var(--faint); font-size: 12px; text-align: center; }
    .signup-error { min-height: 18px; margin: 10px 0 0; color: #c0444a; font-size: 13px; text-align: center; }
    .signup-foot { margin: 22px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
    .signup-foot a { color: var(--accent); font-weight: 600; }
    .signup-foot a:hover { text-decoration: underline; }
    .signup-done { display: none; text-align: center; }
    .signup-done strong { display: block; margin: 12px 0 6px; font-family: var(--display); font-size: 28px; font-weight: 500; }
    .signup-done span { color: var(--ink-soft); font-size: 14px; }
    .signup-form.is-hidden { display: none; }
    .signup-done.is-visible { display: block; }
    .signup-auth.is-hidden { display: none; }
    .signup-avatar { display: grid; width: 76px; height: 76px; margin: 18px auto 14px; place-items: center; overflow: hidden; border-radius: 50%; background: var(--accent); color: #fff; font-family: var(--display); font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
    .signup-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .signup-done span { display: block; margin-top: 4px; }
    .signup-done .signup-submit { max-width: 200px; margin: 22px auto 0; }
    .signup-social { display: grid; gap: 8px; margin-top: 20px; }
    .signup-separator { display: flex; align-items: center; gap: 12px; margin: 22px 0 16px; color: var(--faint); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .signup-separator::before, .signup-separator::after { height: 1px; flex: 1; content: ""; background: var(--line); }
    .signup-social-button { display: flex; width: 100%; min-height: 44px; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .7); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; transition: border-color .25s ease, background .25s ease, transform .25s ease; }
    .signup-social-button:hover { border-color: var(--accent-soft); background: #fff; transform: translateY(-2px); }
    .signup-social-button svg { width: 17px; height: 17px; flex: 0 0 17px; }
  </style>
</head>
<body>
  <div class="signup-page">
    <header class="signup-header">
      <a class="signup-brand" href="/"><img src="/villife-flower.png" alt=""><span>Villife</span></a>
      <a class="signup-back" href="/">Back to home</a>
    </header>
    <main class="signup-main">
      <div class="signup-card">
        <h1 class="signup-title">Sign in</h1>
        <p class="signup-subtitle">Welcome back. Enter the email or username from your profile.</p>
        <div class="signup-auth" id="signin-auth">
          <form class="signup-form" id="signin-form">
            <label class="signup-field">
              <span>Email or username</span>
              <input id="signin-login" type="text" autocomplete="username" placeholder="name@gmail.com" required>
            </label>
            <button class="button button-primary signup-submit" type="submit">Sign in</button>
            <p class="signup-error" id="signin-error"></p>
            <p class="signup-note">Your profile is stored in this browser.</p>
          </form>
          <div class="signup-separator">or continue with</div>
          <div class="signup-social">
            <button class="signup-social-button" type="button" data-provider="microsoft" data-label="Microsoft">
              <svg viewBox="0 0 23 23" aria-hidden="true"><path fill="#f25022" d="M0 0h10.5v10.5H0z"/><path fill="#7fba00" d="M12.5 0H23v10.5H12.5z"/><path fill="#00a4ef" d="M0 12.5h10.5V23H0z"/><path fill="#ffb900" d="M12.5 12.5H23V23H12.5z"/></svg>
              Log in with Microsoft
            </button>
            <button class="signup-social-button" type="button" data-label="Apple">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
              Log in with Apple
            </button>
            <button class="signup-social-button" type="button" data-label="Gmail">
              <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
              Log in with Gmail
            </button>
          </div>
          <p class="signup-error" id="social-status"></p>
          <div class="vlf-extra">
            <button class="vlf-toggle" id="vlf-email-toggle" type="button">Получить код по почте</button>
            <form class="vlf-panel" id="vlf-email-form" hidden>
              <input id="vlf-email-address" type="email" placeholder="name@gmail.com" required>
              <input id="vlf-email-code" inputmode="numeric" placeholder="Код из письма" maxlength="6">
              <button type="submit">Отправить код / Войти</button>
              <p class="vlf-status" id="vlf-email-status"></p>
            </form>
            <button class="vlf-toggle" id="vlf-pass-toggle" type="button">Войти с паролем</button>
            <form class="vlf-panel" id="vlf-pass-form" hidden>
              <input id="vlf-pass-email" type="email" placeholder="name@gmail.com" required>
              <input id="vlf-pass-password" type="password" placeholder="Пароль" required>
              <button type="submit">Войти</button>
              <p class="vlf-status" id="vlf-pass-status"></p>
            </form>
            <button class="vlf-toggle" id="vlf-qr-toggle" type="button">Войти по QR-коду</button>
            <div class="vlf-panel" id="vlf-qr-panel" hidden>
              <div class="vlf-qr" id="vlf-qr-image"></div>
              <p class="vlf-status" id="vlf-qr-status"></p>
            </div>
          </div>
        </div>
        <div class="signup-done" id="signin-done">
            <div class="signup-avatar" id="signin-avatar"></div>
          <strong id="signin-name"></strong>
          <span id="signin-done-text"></span>
          <button class="button button-quiet signup-submit" id="signout" type="button">Sign out</button>
        </div>
        <p class="signup-foot">No account yet? <a href="/signup/">Sign up</a></p>
      </div>
    </main>
  </div>
  <script src="/auth.js"></script>
  <script src="/auth-extra.js?v=20261124-1" defer></script>
  <script>
    const readCookie = name => {
      const part = document.cookie.split("; ").find(item => item.startsWith(name + "="));
      return part ? part.slice(name.length + 1) : "";
    };
    const syncCount = parseInt(readCookie("villife_sync_count"), 10);
    const syncStamp = parseInt(readCookie("villife_sync_ts"), 10);
    if (syncCount && syncStamp && syncStamp > parseInt(localStorage.getItem("villife_sync_ts") || "0", 10)) {
      let syncData = "";
      for (let index = 0; index < syncCount; index++) syncData += readCookie("villife_sync_" + index);
      if (syncData) {
        try {
          const padded = syncData.replace(/-/g, "+").replace(/_/g, "/");
          const json = decodeURIComponent(escape(atob(padded + "=".repeat((4 - padded.length % 4) % 4))));
          const synced = JSON.parse(json);
          if (synced && synced.name) {
            localStorage.setItem("villife_signup", JSON.stringify(synced));
            localStorage.setItem("villife_sync_ts", String(syncStamp));
          }
        } catch (error) {}
      }
    }
    const villifeNext = new URLSearchParams(location.search).get("next") || sessionStorage.getItem("villife_next") || "";
    const form = document.getElementById("signin-form");
    const error = document.getElementById("signin-error");
    const done = document.getElementById("signin-done");
    const auth = document.getElementById("signin-auth");

    function villifeInitials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "?";
      return (parts.length > 1 ? parts[0][0] + parts[1][0] : parts[0].slice(0, 2)).toLocaleUpperCase();
    }

    function villifeShowProfile(profile) {
      auth.classList.add("is-hidden");
      done.classList.add("is-visible");
      const avatar = document.getElementById("signin-avatar");
      if (profile.photo) {
        avatar.textContent = "";
        const picture = document.createElement("img");
        picture.src = profile.photo;
        picture.alt = "";
        avatar.appendChild(picture);
      } else {
        avatar.textContent = villifeInitials(profile.name || profile.username);
      }
      document.getElementById("signin-name").textContent = profile.name || profile.username;
      document.getElementById("signin-done-text").textContent = profile.email || "";
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const login = document.getElementById("signin-login").value.trim().toLocaleLowerCase();
      const raw = localStorage.getItem("villife_signup");
      let profile = null;
      try {
        profile = raw ? JSON.parse(raw) : null;
      } catch (e) {
        profile = null;
      }
      const matches = profile && [profile.email, profile.username].filter(Boolean).some(value => value.toLocaleLowerCase() === login);
      if (!matches) {
        error.textContent = "No profile found for that email or username.";
        return;
      }
      error.textContent = "";
      localStorage.setItem("villife_session", "active");
      villifeShowProfile(profile);
    });

    document.getElementById("signout").addEventListener("click", () => {
      localStorage.setItem("villife_session", "inactive");
      location.href = "/signin/";
    });

    document.querySelectorAll(".signup-social-button").forEach(button => {
      button.addEventListener("click", () => {
        if (button.dataset.provider === "microsoft") {
          if (villifeNext) sessionStorage.setItem("villife_next", villifeNext);
          villifeMicrosoftSignIn();
          return;
        }
        document.getElementById("social-status").textContent = button.dataset.label + " sign-in needs OAuth keys — use the form above for now";
        document.getElementById("signin-login").focus();
      });
    });

    villifeMicrosoftCallback().then(result => {
      if (result && result.name) {
        villifeShowProfile(result);
        if (villifeNext && villifeNext.startsWith("/")) {
          sessionStorage.removeItem("villife_next");
          setTimeout(() => { location.href = villifeNext; }, 900);
        }
      } else if (result && result.error) {
        const message = result.error === "state_mismatch"
          ? "Sign-in session expired. Please try again."
          : "Microsoft sign-in failed: " + result.error;
        document.getElementById("social-status").textContent = message;
      } else {
        const raw = localStorage.getItem("villife_signup");
        if (raw && localStorage.getItem("villife_session") !== "inactive") {
          try {
            const profile = JSON.parse(raw);
            if (profile && profile.name) villifeShowProfile(profile);
          } catch (e) {
            localStorage.removeItem("villife_signup");
          }
        }
      }
    });
  </script>
</body>
</html>
