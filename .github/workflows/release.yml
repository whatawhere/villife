name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for the release, for example v0.1.0
        required: true
        default: v0.1.0
        type: string
      prerelease:
        description: Mark the release as prerelease
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: Villife-macOS
          - os: ubuntu-latest
            label: Linux
            artifact: Villife-Linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare web assets
        run: |
          cp -R src desktop/web
          cp villife.ico desktop/villife.ico

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: desktop
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          npx electron-builder --publish never --config.extraMetadata.version="$version"

      - name: Collect artifacts
        run: |
          mkdir -p bundle
          for file in desktop/dist/*; do
            name=$(basename "$file")
            case "$name" in
              *-arm64.dmg) cp "$file" "bundle/Villife-macOS-arm64.dmg" ;;
              *-arm64-mac.zip) cp "$file" "bundle/Villife-macOS-arm64.zip" ;;
              *.dmg) cp "$file" "bundle/Villife-macOS-x64.dmg" ;;
              *-mac.zip) cp "$file" "bundle/Villife-macOS-x64.zip" ;;
              *.AppImage) cp "$file" "bundle/Villife-linux-x64.AppImage" ;;
              *.deb) cp "$file" "bundle/Villife-linux-amd64.deb" ;;
            esac
          done
          ls -lh bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bundle
          if-no-files-found: error

  build:
    name: Build Windows release
    runs-on: windows-2022
    env:
      SIGN_CERT: ${{ secrets.SIGN_CERT }}
      SIGN_PASS: ${{ secrets.SIGN_PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Fetch WebView2 assemblies
        shell: pwsh
        run: |
          $version = "1.0.4314.35"
          $package = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg"
          Invoke-WebRequest $package -OutFile webview2.zip
          Expand-Archive webview2.zip -DestinationPath wv2pkg -Force
          New-Item -ItemType Directory -Force webview2 | Out-Null
          Copy-Item wv2pkg/lib/net462/Microsoft.Web.WebView2.Core.dll webview2/
          Copy-Item wv2pkg/lib/net462/Microsoft.Web.WebView2.WinForms.dll webview2/
          Copy-Item wv2pkg/build/native/x64/WebView2Loader.dll webview2/
          Copy-Item wv2pkg/build/native/x86/WebView2Loader.dll webview2/

      - name: Fetch .NET Framework reference assemblies
        shell: pwsh
        run: |
          $version = "1.0.3"
          $package = "https://api.nuget.org/v3-flatcontainer/microsoft.netframework.referenceassemblies.net462/$version/microsoft.netframework.referenceassemblies.net462.$version.nupkg"
          Invoke-WebRequest $package -OutFile ref.zip
          Expand-Archive ref.zip -DestinationPath refpkg -Force
          "TargetFrameworkRootPath=$((Resolve-Path refpkg/build).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        run: |
          msbuild src/Villife.csproj /p:Configuration=Release /p:TargetFrameworkRootPath="$env:TargetFrameworkRootPath" /v:m /nologo
          if (-not (Test-Path Villife.exe)) { throw "Villife.exe was not produced" }

      - name: Sign executable
        if: env.SIGN_CERT != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_CERT)
          $pfx = Join-Path $env:RUNNER_TEMP "villife-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool not found" }
          & $signtool sign /f $pfx /p $env:SIGN_PASS /tr http://timestamp.digicert.com /td sha256 /fd sha256 Villife.exe
          if ($LASTEXITCODE -ne 0) { throw "Failed to sign Villife.exe" }
          Remove-Item $pfx -Force

      - name: Package
        shell: pwsh
        run: |
          Remove-Item src/obj, src/bin -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path Villife.exe, Villife.exe.config, src, villife.ico -DestinationPath Villife-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash Villife-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Villife-win-x64.zip" | Out-File -FilePath Villife-win-x64.zip.sha256 -Encoding ascii
          Get-ChildItem Villife-win-x64.zip | Format-Table Name, Length

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $target = "$env:RUNNER_TEMP\innosetup"
            Invoke-WebRequest "https://jrsoftware.org/download.php/is.exe" -OutFile "$env:RUNNER_TEMP\is.exe"
            Start-Process "$env:RUNNER_TEMP\is.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$target" -Wait
            $iscc = "$target\ISCC.exe"
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile WebView2RuntimeInstaller.exe
          if ((Get-Item WebView2RuntimeInstaller.exe).Length -lt 100000) { throw "WebView2 bootstrapper looks broken" }

      - name: Build installer
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          & $env:ISCC "/DAppVersion=$version" installer.iss
          if (-not (Test-Path release-out/VillifeSetup.exe)) { throw "VillifeSetup.exe was not produced" }
          $hash = (Get-FileHash release-out/VillifeSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VillifeSetup.exe" | Out-File -FilePath release-out/VillifeSetup.exe.sha256 -Encoding ascii

      - name: Sign installer
        if: env.SIGN_CERT != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_CERT)
          $pfx = Join-Path $env:RUNNER_TEMP "villife-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool not found" }
          & $signtool sign /f $pfx /p $env:SIGN_PASS /tr http://timestamp.digicert.com /td sha256 /fd sha256 release-out/VillifeSetup.exe
          if ($LASTEXITCODE -ne 0) { throw "Failed to sign VillifeSetup.exe" }
          Remove-Item $pfx -Force
          $hash = (Get-FileHash release-out/VillifeSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VillifeSetup.exe" | Out-File -FilePath release-out/VillifeSetup.exe.sha256 -Encoding ascii

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Villife ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ inputs.prerelease || false }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          body: |
            Windows, macOS and Linux builds of Villife.

            **Windows**
            - `VillifeSetup.exe` - installer. Copies the app to `Program Files\Villife`, adds a Start menu shortcut and installs Microsoft Edge WebView2 Runtime if it is missing.
            - `Villife-win-x64.zip` - portable build. Extract and run `Villife.exe`. Keep the `src` and `webview2` folders next to the executable.

            **macOS**
            - `Villife-macOS-arm64.dmg` - Apple silicon
            - `Villife-macOS-x64.dmg` - Intel
            - `Villife-macOS-arm64.zip` and `Villife-macOS-x64.zip` - the `.app` without an installer

            macOS builds are not notarized yet, so open them with right click and choose Open the first time.

            **Linux**
            - `Villife-linux-x64.AppImage` - runs without installation
            - `Villife-linux-amd64.deb` - `sudo apt install ./Villife-linux-amd64.deb`

            The Windows app needs the Microsoft Edge WebView2 Runtime. The Windows installer takes care of it.

            **Windows may warn about the download.** The installer is not signed yet, so SmartScreen can block it. Right click the file, open Properties, tick Unblock at the bottom, press Apply, then run it.

            Windows archive contents:

            ```
            Villife.exe
            Villife.exe.config
            villife.ico
            src/index.html, src/css/app.css, src/js/app.js
            webview2/Microsoft.Web.WebView2.Core.dll
            webview2/Microsoft.Web.WebView2.WinForms.dll
            webview2/WebView2Loader.dll
            ```
          files: |
            release-out/VillifeSetup.exe
            release-out/VillifeSetup.exe.sha256
            Villife-win-x64.zip
            Villife-win-x64.zip.sha256

  attach:
    name: Attach desktop builds
    needs: [desktop, build]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Upload desktop builds to the release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          files: |
            artifacts/**/*
