name = "villife-search"
main = "search-worker.js"
compatibility_date = "2024-09-23"
account_id = "bd56a9c0fbb01fbb2ba298b7b7a4862d"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "villife-media"

[env.staging]
name = "villife-search-staging"

